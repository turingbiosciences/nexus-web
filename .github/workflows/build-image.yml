name: Build and Publish Image

# Publishes the droplet's web image. The droplet is never pushed to -- it polls
# the registry (deploy/nexus-update.sh in the nexus-api repo, on a systemd
# timer) because tcp/22 is firewalled to admin CIDRs and GitHub runners come
# from thousands of rotating ranges. Moving the :stable tag here is the whole
# deploy; the droplet picks it up within a couple of minutes.
#
# Requires, in this repo's settings:
#   secret DIGITALOCEAN_ACCESS_TOKEN  registry push
#   secret SENTRY_AUTH_TOKEN          optional; without it the build still
#                                     succeeds, it just uploads no source maps
#   var    NEXT_PUBLIC_LOGTO_ENDPOINT baked into the client bundle at build time
#   var    NEXT_PUBLIC_LOGTO_APP_ID   same
#   var    NEXT_PUBLIC_SENTRY_DSN     same; optional
on:
  push:
    branches: [main]
    # Docs do not change the image, and the registry is billed by stored size.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  # Two builds racing to move :stable would leave the loser's image live.
  group: build-image-web
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: registry.digitalocean.com/turing-biosciences/nexus-web

jobs:
  build:
    name: Build and push nexus-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # NEXT_PUBLIC_* values are compiled into the client bundle, so a missing
      # one does not fail the build -- it ships a broken sign-in to production
      # instead. Fail here, where the cause is obvious.
      - name: Check required build configuration
        env:
          LOGTO_ENDPOINT: ${{ vars.NEXT_PUBLIC_LOGTO_ENDPOINT }}
          LOGTO_APP_ID: ${{ vars.NEXT_PUBLIC_LOGTO_APP_ID }}
        run: |
          MISSING=""
          [ -n "$LOGTO_ENDPOINT" ] || MISSING="$MISSING NEXT_PUBLIC_LOGTO_ENDPOINT"
          [ -n "$LOGTO_APP_ID" ]   || MISSING="$MISSING NEXT_PUBLIC_LOGTO_APP_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository variable(s):$MISSING"
            echo "::error::These are baked into the client bundle at build time; without them the image would ship a broken sign-in."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # A BuildKit secret, not a build arg: an ARG lands in the image history
      # and this token can write to the Sentry org.
      - name: Stage the Sentry token
        # Via env, not "${{ secrets.* }}" inline: an inline expansion is pasted
        # into the shell command text before the shell ever runs, so it can
        # surface in a trace or be broken out of by the value itself
        # (githubactions:S7636). As an env var the shell only ever sees a
        # reference.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: printf '%s' "$SENTRY_AUTH_TOKEN" > /tmp/sentry.token

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          push: true
          # :stable is what the droplet follows; the sha tag is the durable
          # handle to pin in .env for a rollback.
          tags: |
            ${{ env.IMAGE }}:stable
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_LOGTO_ENDPOINT=${{ vars.NEXT_PUBLIC_LOGTO_ENDPOINT }}
            NEXT_PUBLIC_LOGTO_APP_ID=${{ vars.NEXT_PUBLIC_LOGTO_APP_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          secret-files: |
            sentry_auth_token=/tmp/sentry.token
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Remove the staged token
        if: always()
        run: rm -f /tmp/sentry.token

      - name: Report the digest the droplet will pick up
        # Contexts come in as env rather than being expanded inline: an inline
        # ${{ }} is pasted into the command text before the shell parses it,
        # which is the code-injection shape Sonar flags (githubactions:S7636).
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| digest | \`$IMAGE_DIGEST\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| sha tag | \`sha-$COMMIT_SHA\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The droplet polls every 2 minutes and will move \`WEB_DIGEST\` in \`/opt/nexus/.env\` to this digest." >> "$GITHUB_STEP_SUMMARY"
